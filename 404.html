<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable | Babacar Prestige Web</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a1128">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#c9d3ec;text-align:center;
      background:radial-gradient(600px 300px at 50% 0%,rgba(46,107,255,.35),transparent 65%),#0a1128}
    h1{color:#fff;font-size:clamp(4rem,14vw,8rem);margin:0;letter-spacing:-.05em;line-height:1}
    h2{color:#fff;font-size:1.5rem;margin:.6rem 0}
    p{max-width:420px;margin:0 auto 1.8rem;line-height:1.6}
    a{display:inline-block;padding:.9rem 1.6rem;border-radius:14px;background:#2e6bff;color:#fff;font-weight:700;text-decoration:none}
    a:hover{background:#1f55e6}
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <h2>Cette page n'existe pas</h2>
    <p>Le lien est peut-être incorrect ou la page a été déplacée.</p>
    <a id="home" href="/">Retour à l'accueil</a>
  </main>
  <script>
    // Sur GitHub Pages (site de projet), l'accueil est /nom-du-depot/
    (function () {
      var h = location.hostname, seg = location.pathname.split("/").filter(Boolean)[0];
      if (/\.github\.io$/.test(h) && seg) document.getElementById("home").href = "/" + seg + "/";
    })();
  </script>
</body>
</html>
